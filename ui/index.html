<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>外设电量</title>
<style>
:root{
  --paper:#f4f0e7;
  --paper-2:#efeade;
  --card:#fdfbf7;
  --ink:#2b2926;
  --muted:#8c877d;
  --hair:#e3dccd;
  --terra:#c2593c;
  --terra-d:#a8492f;
  --green:#5f7f63;
  --green-bg:#e7efe6;
  --amber:#b08a4f;
  --amber-bg:#f5ebda;
  --ease:cubic-bezier(.22,.61,.24,1);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;user-select:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:
    radial-gradient(900px 500px at 12% -10%, #fffdf8 0%, transparent 60%),
    radial-gradient(700px 420px at 96% 8%, #f7f2e6 0%, transparent 65%);
}
.shell{
  position:relative;height:100vh;overflow:hidden;
  padding:12px 36px 8px;
  display:grid;grid-template-rows:minmax(0,1fr) 126px;gap:8px;
}

/* ---------- top ---------- */
.top{
  display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:42px;
  min-height:0;overflow:hidden;
}

.eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted);
  font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.eyebrow i{display:block;width:34px;height:2px;background:var(--terra);border-radius:2px}

h1{
  margin:6px 0 0;font-family:"Songti SC","SimSun",Georgia,serif;
  font-size:31px;line-height:1.18;font-weight:600;letter-spacing:.01em;
}
h1 .line{display:block;overflow:hidden}
h1 .line span{display:block;transform:translateY(110%);animation:rise .72s var(--ease) forwards}
h1 .line:nth-child(2) span{animation-delay:.09s}
h1 em{font-style:normal;color:var(--terra)}
@keyframes rise{to{transform:translateY(0)}}

.sub{margin-top:6px;color:var(--muted);font-size:11px;letter-spacing:.01em;
  opacity:0;animation:fade .6s .36s var(--ease) forwards}
@keyframes fade{to{opacity:1}}

.hero{display:flex;align-items:flex-end;gap:24px;margin-top:2px}
.number{
  display:flex;align-items:flex-start;gap:6px;
  font-family:Georgia,"Times New Roman",serif;line-height:.86;
  font-variant-numeric:tabular-nums;
}
.number .val.stale{opacity:.5}
.number .val{font-size:62px;letter-spacing:-.02em;transition:color .5s var(--ease)}
.number .unit{font-size:17px;color:var(--muted);margin-top:4px}
.meta{padding-bottom:8px;min-width:0}
.meta .name{font-size:13px;font-weight:600;letter-spacing:.01em}
.meta .model{margin-top:5px;color:var(--muted);font-size:11px}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:7px;
  padding:4px 10px 4px 7px;border-radius:999px;font-size:10.5px;
  color:var(--green);background:var(--green-bg);transition:background .3s var(--ease)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.warn{color:var(--amber);background:var(--amber-bg)}
.chip.idle{color:var(--muted);background:var(--paper-2)}
.chip .bolt{opacity:0;transition:opacity .3s}
.chip.charging .bolt{opacity:1;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-1px)}}

/* ruler */
.ruler{margin-top:10px;position:relative;height:26px}
.ruler .track{position:absolute;left:0;right:0;top:7px;height:1px;background:var(--hair)}
.ruler .fill{position:absolute;left:0;top:6px;height:3px;background:var(--terra);
  border-radius:3px;width:0;transition:width 1.05s var(--ease)}
.ruler .dot{position:absolute;top:2px;width:11px;height:11px;border-radius:50%;
  background:var(--terra);left:0;transform:translateX(-50%);
  box-shadow:0 0 0 4px var(--paper);transition:left 1.05s var(--ease)}
.ruler .tick{position:absolute;top:4px;width:1px;height:7px;background:#d6cfbf}
.ruler .tick.big{height:11px;top:2px;background:#c8c0af}
.ruler .lab{position:absolute;top:17px;font-size:9px;color:var(--muted);transform:translateX(-50%)}

/* buttons */
.actions{display:flex;align-items:center;gap:9px;margin-top:10px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;
  height:31px;padding:0 14px;border-radius:999px;font-size:12px;
  transition:transform .18s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--terra);color:#fdf8f2;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.btn.primary:hover{background:var(--terra-d);box-shadow:0 6px 18px -10px var(--terra)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.btn.ghost:hover{background:#faf6ec}
.btn .spin{width:13px;height:13px;border-radius:50%;
  border:2px solid rgba(253,248,242,.35);border-top-color:#fdf8f2;display:none}
.btn.busy .spin{display:block;animation:spin .8s linear infinite}
.btn.busy .icon{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbar{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--muted);font-size:11px}
.linkbar button{color:inherit;padding:4px 2px;border-bottom:1px solid transparent;
  transition:color .2s,border-color .2s}
.linkbar button:hover{color:var(--ink);border-color:var(--hair)}
.linkbar .on{color:var(--green)}
.foot{margin-top:auto;padding-top:12px;color:#a49d90;font-size:10px;letter-spacing:.02em;
  display:flex;align-items:center;gap:8px;opacity:0;animation:fade .8s .6s var(--ease) forwards}
.foot .dotline{width:26px;height:1px;background:#d5cebf;display:block}

/* ---------- figure card ---------- */
.figure{
  background:var(--card);border-radius:16px;box-shadow:inset 0 0 0 1px var(--hair);
  padding:10px 18px 10px;display:flex;flex-direction:column;
  height:100%;min-height:0;overflow:hidden;
  opacity:0;transform:translateY(10px);animation:cardIn .7s .12s var(--ease) forwards;
}
@keyframes cardIn{to{opacity:1;transform:none}}
.figure .fg-top{display:flex;justify-content:space-between;align-items:center;
  color:var(--muted);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.art{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:4px 0}
.art svg{width:100%;height:100%;overflow:visible}
.art .callout{position:absolute;font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.art .c1{right:4%;top:14%}
.art .c2{left:0%;top:47%}
.art .c3{right:16%;bottom:6%}
.art .pulse{opacity:.0;animation:idlePulse 3.4s ease-in-out infinite}
@keyframes idlePulse{0%,100%{opacity:.05}50%{opacity:.22}}

.fg-div{height:1px;background:var(--hair);margin:2px 0 9px}
.fg-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fg-cols .k{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fg-cols .v{margin-top:4px;font-size:11.5px;font-variant-numeric:tabular-nums}
.quote{margin-top:6px;text-align:center;color:#b7afa0;font-size:12.5px;
  font-family:Georgia,serif;font-style:italic}

/* ---------- devices ---------- */
.bottom{flex:0 0 auto}
.sec-head{display:flex;align-items:center;gap:12px;color:var(--muted);
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;line-height:12px}
.sec-head i{display:block;width:30px;height:2px;background:var(--terra);border-radius:2px}
.sec-title{display:flex;align-items:baseline;gap:9px;margin-top:1px}
.sec-title h2{margin:0;font-family:"Songti SC","SimSun",Georgia,serif;
  font-size:17px;font-weight:600;line-height:1.3}
.sec-title span{color:var(--muted);font-size:11px}
.hint{margin-left:auto;color:var(--amber);font-size:10.5px;max-width:430px;text-align:right;line-height:1.4}

.cards{display:grid;grid-template-columns:repeat(2,282px) 1fr;gap:12px;
  margin-top:6px;grid-auto-rows:78px}
.dcard{position:relative;background:var(--card);border-radius:12px;
  padding:6px 12px;box-shadow:inset 0 0 0 1px var(--hair);cursor:pointer;
  transition:transform .22s var(--ease),box-shadow .25s var(--ease),background .25s}
.dcard:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px #d9d1bf,0 10px 24px -18px rgba(60,45,30,.5)}
.dcard.active{box-shadow:inset 0 0 0 1.5px var(--terra)}
.dcard .row{display:flex;align-items:center;gap:10px}
.dcard .ico{width:24px;height:24px;border-radius:8px;background:#f3efe6;display:grid;place-items:center;flex:0 0 auto}
.dcard .pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:9px;padding:2px 7px;border-radius:999px;background:var(--paper-2);color:var(--muted)}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.dcard .nm{margin-top:4px;font-size:11.5px;font-weight:600}
.dcard .md{margin-top:2px;color:var(--muted);font-size:9.5px;letter-spacing:.02em}
.dcard.stale .pct,.dcard.stale .bar{opacity:.55}
.dcard .pct{position:absolute;right:12px;bottom:16px;font-family:Georgia,serif;
  font-size:17px;font-variant-numeric:tabular-nums;transition:color .4s}
.dcard .bar{position:absolute;right:12px;bottom:9px;width:60px;height:3px;border-radius:3px;background:#ece6da;overflow:hidden}
.dcard .bar b{display:block;height:100%;width:0;border-radius:3px;background:var(--green);
  transition:width 1.05s var(--ease),background .4s}
.empty{height:100%;border-radius:12px;border:1px dashed #d8d1c1;display:grid;place-items:center;color:var(--muted);font-size:10.5px;text-align:center;padding:0 14px;line-height:1.5}

/* ---------- debug modal ---------- */
.modal{position:fixed;inset:0;background:rgba(43,41,38,.28);backdrop-filter:blur(2px);
  display:none;place-items:center;opacity:0;transition:opacity .22s var(--ease);z-index:20}
.modal.open{display:grid;opacity:1}
.panel{width:min(880px,88vw);height:min(560px,82vh);background:var(--card);border-radius:16px;
  box-shadow:0 30px 70px -30px rgba(40,30,20,.5);display:grid;grid-template-columns:1fr 300px;
  overflow:hidden;transform:translateY(8px);transition:transform .22s var(--ease)}
.modal.open .panel{transform:none}
.panel .left{padding:16px 8px 12px 16px;display:flex;flex-direction:column;min-height:0}
.panel .right{padding:16px;background:#fbf8f1;display:flex;flex-direction:column;gap:8px;min-height:0}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ifaces{overflow:auto;font-family:"Cascadia Mono",Consolas,monospace;font-size:11px;flex:1}
.ifaces .it{padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ifaces .it:hover{background:#f6f1e6}
.ifaces .it.sel{background:#f1e8d9;color:var(--terra-d)}
.detail{font-family:"Cascadia Mono",Consolas,monospace;font-size:10.5px;color:var(--muted);
  white-space:pre-wrap;word-break:break-all;max-height:180px;overflow:auto;line-height:1.6}
.trace{flex:1;overflow:auto;font-family:"Cascadia Mono",Consolas,monospace;font-size:10.5px;
  color:#5a564e;line-height:1.55;white-space:pre-wrap;word-break:break-all}
.panel .close{position:absolute;right:22px;top:18px}

/* 矮屏（笔记本 720p / 125%~150% 缩放）再压一档 */
@media (max-height: 610px){
  .shell{padding:10px 30px 6px;gap:2px}
  h1{font-size:27px}
  .number .val{font-size:54px}
  .ruler{margin-top:6px}
  .actions{margin-top:6px}
  .dcard{padding:6px 12px}
  .dcard .nm{margin-top:3px}
  .empty{min-height:56px}
  .sub{margin-top:4px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <section class="left-col">
      <div class="eyebrow"><i></i><span>此刻 · CURRENT CHARGE</span></div>
      <h1><span class="line"><span id="h1a">电量还够，</span></span><span class="line"><span><em id="h1b">不必惦记。</em></span></span></h1>
      <div class="sub" id="sub">正在读取…</div>

      <div class="hero">
        <div class="number"><span class="val" id="pct">—</span><span class="unit">%</span></div>
        <div class="meta">
          <div class="name" id="devName">—</div>
          <div class="model" id="devModel">—</div>
          <div class="chip" id="chip"><span class="bolt">⚡</span><span id="chipText">读取中</span></div>
        </div>
      </div>

      <div class="ruler" id="ruler">
        <div class="track"></div><div class="fill" id="rf"></div><div class="dot" id="rd"></div>
      </div>

      <div class="actions">
        <button class="btn primary" id="btnRefresh"><span class="spin"></span><span class="icon">⟳</span>刷新一下</button>
        <button class="btn ghost" id="btnInterval"><span class="icon">⏱</span><span id="intervalText">每 1 分钟</span></button>
        <div class="linkbar">
          <button id="btnAuto">开机自启 · 关</button>
          <button id="btnDebug">调试</button>
          <button id="btnQuit">退出</button>
        </div>
      </div>

      <div class="foot"><span class="dotline"></span>数据直读自 2.4G 接收器，不经过官方驱动；点托盘图标可立刻刷新。</div>
    </section>

    <aside class="figure">
      <div class="fg-top"><span>FIG. 01</span><span id="figLink">2.4G · LOCAL</span></div>
      <div class="art" id="art"></div>
      <div class="fg-div"></div>
      <div class="fg-cols">
        <div><div class="k">协议</div><div class="v" id="fProto">—</div></div>
        <div><div class="k">链路</div><div class="v" id="fLink">—</div></div>
        <div><div class="k">更新</div><div class="v" id="fTime">—</div></div>
      </div>
      <div class="quote" id="quote">“quietly connected.”</div>
    </aside>
  </div>

  <section class="bottom">
    <div class="sec-head"><i></i><span>DEVICES</span></div>
    <div class="sec-title"><h2>设备</h2><span id="devCount">· 2</span><div class="hint" id="hint"></div></div>
    <div class="cards" id="cards"></div>
  </section>
</div>

<div class="modal" id="modal">
  <div class="panel">
    <div class="left">
      <h3>HID 接口</h3>
      <div class="ifaces" id="ifaces"></div>
    </div>
    <div class="right">
      <div class="detail" id="detail">选一个接口查看详情</div>
      <button class="btn ghost" id="btnDump" style="align-self:flex-start">转储输入报告 2 秒</button>
      <div class="trace" id="trace"></div>
      <button class="btn ghost" id="btnCloseDebug" style="align-self:flex-end">关闭</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const hex4 = (v) => (v || 0).toString(16).toUpperCase().padStart(4, '0');
let state = {devices: [], interval: 60, autostart: false, busy: false, selected: 0};
let shownPct = null;       // 当前显示的数字
let animRAF = null;


function buildRuler(){
  const r = $('ruler');
  r.querySelectorAll('.tick,.lab').forEach(n => n.remove());
  for (let i = 0; i <= 100; i += 10){
    const big = (i % 50 === 0);
    const t = document.createElement('div');
    t.className = 'tick' + (big ? ' big' : '');
    t.style.left = i + '%';
    r.appendChild(t);
    if (big){
      const l = document.createElement('div');
      l.className = 'lab';
      l.style.left = i + '%';
      l.textContent = i;
      r.appendChild(l);
    }
  }
}
buildRuler();

/* ---------- 数字滚动 ---------- */
function tweenNumber(target){
  target = Math.max(0, Math.min(100, target));
  cancelAnimationFrame(animRAF);
  const from = shownPct === null ? Math.max(0, target - 34) : shownPct;
  const t0 = performance.now(), dur = 900;
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  function step(now){
    const t = Math.min(1, (now - t0) / dur);
    const v = from + (target - from) * ease(t);
    shownPct = v;
    $('pct').textContent = Math.round(v);
    if (t < 1) animRAF = requestAnimationFrame(step);
  }
  animRAF = requestAnimationFrame(step);
}

/* ---------- 文案 ---------- */
function headline(pct){
  if (pct === null || pct === undefined) return ['一眼没看清，', '稍后再问我。'];
  if (pct >= 60) return ['电量还够，', '不必惦记。'];
  if (pct >= 30) return ['电量过半，', '还能撑会儿。'];
  return ['电量见底，', '这就去充电。'];
}
const levelColor = (p) => p === null || p === undefined ? 'var(--muted)'
  : p >= 60 ? 'var(--green)' : p >= 30 ? '#a8862f' : '#b05348';

/* ---------- 小图 ---------- */
function art(kind){
  if (kind === 'keyboard'){
    let keys = '';
    for (let r = 0; r < 3; r++) for (let c = 0; c < 12; c++){
      keys += `<rect x="${18+c*15}" y="${14+r*17}" width="12" height="13" rx="3" fill="#efe9de" stroke="#ddd5c6"/>`;
    }
    return `<svg viewBox="0 0 240 150">
      <rect class="pulse" x="40" y="30" width="160" height="90" rx="10" fill="#c2593c"/>
      <rect x="40" y="30" width="160" height="90" rx="10" fill="#fbf8f2" stroke="#8e8678" stroke-width="1.6"/>
      ${keys}</svg>
      <div class="callout c1">2.4G</div><div class="callout c3">rdr link</div>`;
  }
  return `<svg viewBox="0 0 260 190">
    <ellipse class="pulse" cx="118" cy="92" rx="46" ry="62" fill="#c2593c"/>
    <ellipse cx="118" cy="92" rx="44" ry="60" fill="#fbf8f2" stroke="#8e8678" stroke-width="1.6"/>
    <line x1="118" y1="32" x2="118" y2="66" stroke="#8e8678" stroke-width="1.4"/>
    <rect x="109" y="44" width="18" height="26" rx="9" fill="#f1ece2" stroke="#8e8678" stroke-width="1.3"/>
    <line x1="75" y1="76" x2="75" y2="104" stroke="#c2593c" stroke-width="3" stroke-linecap="round"/>
    <rect x="186" y="118" width="44" height="17" rx="4" fill="#fbf8f2" stroke="#8e8678" stroke-width="1.5"/>
    <line x1="230" y1="122" x2="240" y2="122" stroke="#8e8678" stroke-width="1.4"/>
    <line x1="230" y1="131" x2="240" y2="131" stroke="#8e8678" stroke-width="1.4"/>
    <line x1="164" y1="112" x2="182" y2="122" stroke="#cfc8b9" stroke-dasharray="3 4"/>
  </svg>
  <div class="callout c1">2.4G</div><div class="callout c2">click</div><div class="callout c3">dongle</div>`;
}

/* ---------- 渲染 ---------- */
function render(s){
  if (s) state = s;
  const list = state.devices || [];
  const sel = Math.min(state.selected || 0, Math.max(0, list.length - 1));
  const d = list[sel] || {};
  const live = (d.percent === undefined || d.percent === null) ? null : d.percent;
  const stale = live === null && d.last && d.last.percent !== undefined && d.last.percent !== null;
  const pct = stale ? d.last.percent : live;
  const charging = stale ? !!d.last.charging : !!d.charging;

  const [a, b] = headline(pct);
  if ($('h1a').textContent !== a || $('h1b').textContent !== b){
    $('h1a').textContent = a; $('h1b').textContent = b;
    document.querySelectorAll('h1 .line span').forEach(el => {
      el.style.animation = 'none'; void el.offsetWidth;
      el.style.animation = '';
    });
  }

  $('sub').textContent = stale
    ? `上次 ${d.last.time || ''} 读到 ${pct}%，动一下鼠标就会更新。`
    : pct === null
      ? `经由 ${d.source || ''} 读取，等待设备回应…`
      : `经由 ${d.source || ''} 读取，${d.time || ''} 更新。`;

  $('devName').textContent = d.name || '—';
  $('devModel').textContent = d.found === false ? '未检测到设备' :
    `${d.source || ''}  ·  0x${hex4(d.vid)}:0x${hex4(d.pid)}`;

  const chip = $('chip');
  chip.className = 'chip' + (stale ? ' warn' : pct === null
    ? (d.state === 'idle' || d.state === 'sleep' ? ' warn' : ' idle')
    : (charging ? ' charging' : ''));
  $('chipText').textContent = stale ? '休眠中'
    : pct === null
      ? (d.state === 'sleep' ? '休眠中' : d.state === 'idle' ? '未响应'
         : d.state === 'disconnected' ? '未连接' : '读取中')
      : (charging ? '充电中' : '已连接');

  if (pct === null){
    $('pct').textContent = '—';
    $('pct').classList.remove('stale');
    $('pct').style.color = 'var(--muted)';
    shownPct = null;
  } else {
    $('pct').style.color = levelColor(pct);
    $('pct').classList.toggle('stale', stale);
    tweenNumber(pct);
  }

  /* 刻度 */
  const rf = $('rf'), rd = $('rd');
  requestAnimationFrame(() => {
    rf.style.width = (pct || 0) + '%';
    rd.style.left = (pct || 0) + '%';
  });

  /* 右侧卡片 */
  $('art').innerHTML = art(d.key);
  $('figLink').textContent = `${(d.source || '').includes('RDR') ? 'RDR 2.4G' : '2.4G'} · LOCAL`;
  $('fProto').textContent = d.key === 'mouse' ? 'Vendor 0xFFC1' : 'RDR 0x30';
  $('fLink').textContent = d.found === false ? '—' : '2.4 GHz';
  $('fTime').textContent = d.time || '—';
  $('quote').textContent = `“${stale ? 'asleep for now…' : pct === null ? 'waiting for it…' : 'quietly connected.'}”`;

  /* 按钮 / 状态 */
  $('btnRefresh').classList.toggle('busy', !!state.busy);
  $('intervalText').textContent = state.interval < 60
    ? `每 ${state.interval} 秒` : `每 ${state.interval / 60} 分钟`;
  $('btnAuto').textContent = `开机自启 · ${state.autostart ? '开' : '关'}`;
  $('btnAuto').classList.toggle('on', !!state.autostart);

  /* 设备卡 */
  const cards = list.map((it, i) => {
    const pLive = (it.percent === undefined || it.percent === null) ? null : it.percent;
    const pStale = pLive === null && it.last && it.last.percent !== undefined && it.last.percent !== null;
    const p = pStale ? it.last.percent : pLive;
    const cls = (i === sel ? 'dcard active' : 'dcard') + (pStale ? ' stale' : '');
    const pill = pStale
      ? `<span class="pill warn">休眠 ${p}%</span>`
      : p === null
        ? `<span class="pill ${it.state === 'idle' || it.state === 'sleep' ? 'warn' : ''}">${it.state === 'sleep' ? '休眠中' : it.state === 'idle' ? '未响应' : '读取中'}</span>`
        : `<span class="pill ok">已连接</span>`;
    const icon = it.key === 'mouse'
      ? `<svg width="16" height="22" viewBox="0 0 16 22"><rect x="1" y="1" width="14" height="20" rx="7" fill="none" stroke="#2b2926" stroke-width="1.4"/><line x1="8" y1="1" x2="8" y2="8" stroke="#2b2926" stroke-width="1.4"/></svg>`
      : `<svg width="20" height="14" viewBox="0 0 20 14"><rect x="1" y="1" width="18" height="12" rx="3" fill="none" stroke="#2b2926" stroke-width="1.4"/><line x1="5" y1="5" x2="5" y2="7" stroke="#2b2926"/><line x1="9" y1="5" x2="9" y2="7" stroke="#2b2926"/><line x1="13" y1="5" x2="13" y2="7" stroke="#2b2926"/></svg>`;
    return `<div class="${cls}" data-i="${i}">
      <div class="row"><div class="ico">${icon}</div><div class="pills">${pill}<span class="pill">托盘</span></div></div>
      <div class="nm">${it.name}</div>
      <div class="md">0x${it.vid.toString(16).toUpperCase()}:${it.pid.toString(16).toUpperCase()}  ·  ${it.source}</div>
      ${p === null ? '' : `<div class="pct" style="color:${levelColor(p)}">${p}%</div>
      <div class="bar"><b data-w="${p}"></b></div>`}
    </div>`;
  }).join('');
  $('cards').innerHTML = cards + `<div class="empty">加一台设备？<br>把接收器插上，它自己会出现在这里。</div>`;
  document.querySelectorAll('.dcard').forEach(el => el.onclick = () => {
    pick(parseInt(el.dataset.i, 10));
  });
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar b').forEach(b => { b.style.width = b.dataset.w + '%'; });
  });

  /* 提示 */
  const other = list.find((it, i) => i !== sel && it.state !== 'ok' && it.detail);
  $('hint').textContent = other ? other.detail.replace(/[（）()]/g, '') : '';
  $('devCount').textContent = `· ${list.length}`;
}

/* ---------- 交互 ---------- */
async function boot(){
  const s = await window.pywebview.api.state();
  render(s);
}
function call(fn, ...args){
  const api = window.pywebview.api;
  return api[fn](...args);
}
async function pick(i){
  const s = await call('select', i);
  render(s);
}
$('btnRefresh').onclick = async () => {
  render({...state, busy: true});
  const s = await call('refresh');
  render(s);
};
$('btnInterval').onclick = async () => render(await call('cycle_interval'));
$('btnAuto').onclick = async () => render(await call('toggle_autostart'));
$('btnQuit').onclick = () => call('quit');
$('btnDebug').onclick = async () => {
  $('modal').classList.add('open');
  const list = await call('hid_list');
  $('ifaces').innerHTML = list.map((it, i) =>
    `<div class="it" data-i="${i}">${it.label}</div>`).join('');
  document.querySelectorAll('.ifaces .it').forEach(el => el.onclick = async () => {
    document.querySelectorAll('.ifaces .it').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    $('detail').textContent = await call('hid_detail', parseInt(el.dataset.i, 10));
    $('currentIface').value = el.dataset.i;
  });
};
$('btnCloseDebug').onclick = () => $('modal').classList.remove('open');
$('modal').onclick = (e) => { if (e.target === $('modal')) $('modal').classList.remove('open'); };
$('btnDump').onclick = async () => {
  const sel = document.querySelector('.ifaces .it.sel');
  if (!sel) { $('trace').textContent = '先在左边选一个接口'; return; }
  $('trace').textContent = '采样中…';
  const lines = await call('dump_reports', parseInt(sel.dataset.i, 10));
  $('trace').textContent = lines.join('\n') || '（2 秒内没有任何输入报告）';
};

/* 与 Python 同步：轮询状态（WebView2 不允许后台线程直接改 UI） */
let lastJson = '';
async function poll(){
  try{
    const s = await window.pywebview.api.state();
    const j = JSON.stringify(s);
    if (j !== lastJson){ lastJson = j; render(s); }
  }catch(e){}
}
async function startPolling(){
  try{ await boot(); }catch(e){}
  setInterval(poll, 600);
}
window.addEventListener('pywebviewready', startPolling);
if (window.pywebview) startPolling();
</script>
<input type="hidden" id="currentIface">
</body>
</html>
