name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pythonnet pyinstaller

      - name: 打包
        run: powershell -File build.ps1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: peripheral-battery
          path: dist/外设电量/**
